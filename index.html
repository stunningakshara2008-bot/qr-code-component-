<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    main{
      background-color: hsl(212, 45%, 89%);
      display:flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-wrap: wrap;
    }

    .card{
      background-color:hsl(0, 0%, 100%);
      height: 480px;
      width:300px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      border-radius: 10px;
      padding: 8px;
      box-sizing: border-box;
    }
    .card img{
      border-radius: 10px;
    }
    .card p{
      color:hsl(216, 15%, 48%);
      font-size: 15px;
      padding: 0px  20px;
      text-align: center;
    }
    .card h2{
      text-align: center;
    }
  </style>
</head>
<body><main><div class="card">
  <img src="image-qr-code.png" width="270px" height="270px">
  <h2>Improve your front-end skills by building projects.<br></h2>

  <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p></div></main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Akshara Agrawal </a>.
  </footer>
</body>
</html>
